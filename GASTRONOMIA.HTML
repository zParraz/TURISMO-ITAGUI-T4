<body>

<div class="container justify-content-center">

        <h2>Gastronomía</h2> <!--Titulo-->



        <!-- Trataré de explicar aqui habra un cuadro o un Container como me dijiste santi,bueno. Entonces este 
  container habra dos fichas donde habra el titulo y el boton donde dirá "ver más" -->

        <!-- Bueno las fichas se llama (Restaurante y Distrito Gastónomico) pues las fichas esas-->

        <!--Tarjeta o cuadro 1: Restaurantes-->
        <div class="TarjetaRestaurant">

          <!-- Imagen del restaurante -->
          <img src="" alt="" class=""> <!--AQUI VA LA FOTO LLAMADA resta-->

          <!-- Texto dentro de la imagen (título principal de la tarjeta o cuadro o ficha no se) -->
          <div class="timagen">
            <h3>Restaurantes</h3>
          </div>

          <!-- Botón para ver más información -->
          <a href="#" class="boton">Ver Más ></a> <!-- Este boton lleva al restaurantes-->
        </div>
        <!--FIN TARJETA O CUADRO 1-->



        <!--Tarjeta o cuadro 2: Distrito Gastronómico Callejero ======= -->
        <div class="tarjetacallejero">

          <!-- Imagen del distrito gastronómico -->
          <img src="" alt="" class=""> <!--AQUI VA LA FOTO LLAMADA distrito-->

          <!-- Texto dentro de la imagen -->
          <div class="titimagen">
            <h3>Distrito Gastronómico Callejero</h3>
          </div>

          <!-- Botón para ver más -->
          <a href="#" class="boton">Ver Más ></a> <!--POR CIERTO SE ME OLVIDO QUE EL BOTON ES REDONDO 
      PUES NO TAN CUADRADO TIENE LOS LADOS CURVIADAS O ALGO ASI -->

          <!-- Este boton lleva al distrito-->

        </div>
        <!-- FIN TARJETA O CUADRO 2 -->

        <!--La imagen solo va en la parte superior del cuadro, no ocupa todo el fondo. Dentro de esa imagen, 
    va el título (por ejemplo “Restaurantes”) dentro de un pequeño cuadro o fondo blanco/transparente para 
    que se lea bien debajo de la imagen va el botón “Ver más”. (o pon el titulo grande debajo de la imagen y 
    que la imagen sea no tan cuadrado) -->



        <!-- SEGUNDA SESION DEBAJO DEL CUADRO PUES UN POQUITO-->

        <!-- RECETAS TIPICAS-->

        <!-- Título principal-->
        <h2 class="titurecesti">Recetas típicos</h2>

        <!-- Contenedor general para agrupar las tarjetas de recetas -->
        <div class="contenedorrecetas">

          <!-- TARJETA 1: BANDEJA PAISA-->
          <div class="tarjeta-receta">

            <!-- Imagen del plato BANDEJA PAISA -->
            <img src="" alt="" class=""> <!-- AQUI VA LA IMAGEN BANDEJA PAISA-->

            <!-- Nombre del plato -->
            <h3 class="nombre-receta">Bandeja Paisa</h3>

            <!-- Botón de acción -->
            <a href="#" class="boton-receta">Ver Recetas ></a> <!--Llevará a la pagina recetas de la bandeja paisa-->
          </div>
          <!-- FIN TARJETA 1 -->


          <!--TARJETA 2: SANCOCHO ANTIOQUEÑO -->
          <div class="tarjeta-receta">

            <img src="" alt="" class=""> <!--AQUI VA LA IMAGEN ANTIOQUEÑO-->
            <h3 class="nombre-receta">Sancocho Antioqueño</h3>
            <a href="#" class="boton-receta">Ver Recetas ></a> <!--Llevará a la pagina recetas del sancocho-->
          </div>
          <!-- FIN TARJETA 2  -->


          <!-- TARJETA 3: TAMALES ANTIOQUEÑOS-->
          <div class="tarjeta-receta">

            <img src="" alt="" class=""> <!--AQUI VA LA IMAGEN TAMALESS-->
            <h3 class="nombre-receta">Tamales Antioqueños</h3>
            <a href="#" class="boton-receta">Ver Recetas ></a> <!--Llevará a la pagina recetas de los tamales-->

          </div>
          <!-- FIN TARJETA 3 -->


          <!-- TARJETA 4: AREPAS PAISA-->

            <img src="" alt="" class=""> <!--AQUI VA LA IMAGEN PAISA-->
            <h3 class="nombre-receta">Arepas Paisa</h3>
            <a href="#" class="boton-receta">Ver Recetas ></a> <!--Llevará a la pagina recetas de las arepas paisas-->

            <!-- FIN DE LA TARJETA -->

          </div>
